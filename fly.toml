# fly.toml app configuration file generated for irontrackgym on 2026-11-17T19:27:54+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'irontrackgym'
primary_region = 'lhr'

[build]

[env]
  BETTER_AUTH_URL = 'https://irontrackgym.fly.dev'
  CORS_ORIGINS = 'https://irontrackgym.fly.dev'
  FORCE_IPV4_DNS = '0'
  NODE_ENV = 'production'
  PORT = '5000'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
